version: 2
# CI gates only the runtime tree (npm audit --omit=dev); dev-tree advisories are tracked here.
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@noble/*"
          - "@theqrl/*"
    ignore:
      # TypeScript 7 (typescript-go) ships no JS compiler API, so typescript-eslint
      # (peer typescript <6.1.0) cannot load it and `npm ci` fails with ERESOLVE.
      # Drop this once typescript-eslint supports TS 7:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
